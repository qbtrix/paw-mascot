[package]
name = "paw-mascot"
version = "0.1.0"
description = "A mascot on your desktop that reacts while Claude works."
authors = ["qbtrix"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "paw_mascot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
# tray-icon is the anchor; macos-private-api is what a transparent
# frameless window needs on macOS; image-png reads the tray icon.
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png"] }
