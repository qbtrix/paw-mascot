<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paw</title>
<meta name="description" content="A mascot on your desktop that reacts while your coding agent works. Free, open source, macOS.">
<link rel="icon" href="/favicon.png">
<!--
  Creative Direction Declaration
  Archetype: Playfulness held inside Technology. Richness: Minimalist.
  Critique: the trap here is a hero that explains the mascot in words. The
  mascot explains itself, so the page is the twenty-eight states, live, and
  the only sentence on it is the download button. Family: Clean-Tech, off-black
  ground, hairline cards, one ice-blue accent and purple only where a theme
  asks for it: the
  character's own rim ramp is re-tokened on this page so the violet stop in the
  shipped drawing never appears here. Reading this as: a dev-tool landing page
  for a desktop pet, matching the captain's reference grid one for one, driving
  Playfulness through Clean-Tech with Instrument Sans over Manrope and a mono
  for the state labels. Dials: VARIANCE 4 (the grid is the point), MOTION 3
  (the mascots move; the page does not), DENSITY 4.

  The site is the product's own engine: each card is a live paw-avatar holding
  one state, the same vendored effect the app ships, served at /_fx/ exactly as
  the app serves it. Nothing on this page is a screenshot.

  Created 2026-09-15. Assembled into dist/site by scripts/build-site.mjs.
-->
<link rel="stylesheet" href="/_fx/effects/paw-avatar/style.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@500;600&family=Manrope:wght@400;500&display=swap');

  :root {
    /* The ground is the captain's swatch: a warm olive charcoal, read off the
       pasted swatch by eye (~rgb 37 38 33). Warm room, cool creatures: the
       mascots' ice glow is the only cold thing on the page, which is what
       makes them read as lit screens. Panel, lines and text re-key warm. */
    --bg: #252621;
    --panel: #2b2c26;
    --well: #1f201b;
    --line: #36372f;
    --line-hi: #47483e;
    --ink: #edeee6;
    --dim: #9b9d90;
    --accent: #8cc6ff;
    --radius: 14px;
    --display: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
    --body: "Manrope", "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
  }
  /* Six rooms for the same creatures. A theme is nothing but tokens: the
     page's ground and the mascot's material are both CSS vars, so one
     attribute on <html> rethemes all twenty-eight at once. That is also the
     sales pitch: this is the exact theming a host page gets from paw-fx. */
  :root[data-theme="ink"] {
    --bg: #141a27; --panel: #1a2131; --well: #10151f;
    --line: #252d40; --line-hi: #364259; --ink: #e9edf7; --dim: #8a94ab;
  }
  :root[data-theme="ember"] {
    --bg: #241f1a; --panel: #2a241e; --well: #1c1815;
    --line: #3a322a; --line-hi: #4c4236; --ink: #f0eae2; --dim: #a2988a;
    --accent: #ffb454;
    --paw-rim-a: #fff7ec; --paw-rim-b: #ffe2b8; --paw-rim-c: #ffc478;
    --paw-rim-d: #ffb454; --paw-rim-e: #ffd9a0;
    --paw-glow: rgba(255, 180, 84, .38); --paw-halo: #d99a4e; --paw-eye: #fff6e8;
  }
  :root[data-theme="moss"] {
    --bg: #1c211b; --panel: #222821; --well: #161a15;
    --line: #303a2f; --line-hi: #40503e; --ink: #e9efe6; --dim: #93a08e;
    --accent: #9fe8b0;
    --paw-rim-a: #f2fff4; --paw-rim-b: #d1ffd9; --paw-rim-c: #a9f0b8;
    --paw-rim-d: #8fe6a4; --paw-rim-e: #c8f7d0;
    --paw-glow: rgba(140, 230, 170, .36); --paw-halo: #6fbf88; --paw-eye: #f2fff5;
  }
  :root[data-theme="rose"] {
    --bg: #231d1f; --panel: #292225; --well: #1b1618;
    --line: #3a3034; --line-hi: #4c3f45; --ink: #f4ecef; --dim: #a3939a;
    --accent: #ff9db8;
    --paw-rim-a: #fff2f6; --paw-rim-b: #ffd6e2; --paw-rim-c: #ffadc6;
    --paw-rim-d: #ff9db8; --paw-rim-e: #ffc9d9;
    --paw-glow: rgba(255, 157, 184, .34); --paw-halo: #d97d97; --paw-eye: #fff3f7;
  }
  :root[data-theme="graphite"] {
    --bg: #202124; --panel: #26272b; --well: #1a1b1e;
    --line: #343640; --line-hi: #464956; --ink: #f0f1f4; --dim: #9a9ca6;
    --accent: #e8eaf0;
    --paw-rim-a: #ffffff; --paw-rim-b: #f2f4f8; --paw-rim-c: #d9dde6;
    --paw-rim-d: #c4c9d6; --paw-rim-e: #e6e9f0;
    --paw-glow: rgba(230, 235, 245, .32); --paw-halo: #aab0c0; --paw-eye: #ffffff;
  }
  :root[data-theme="violet"] {
    --bg: #1e1a27; --panel: #241f2f; --well: #171320;
    --line: #332c44; --line-hi: #453b5c; --ink: #eeeaf7; --dim: #988fad;
    --accent: #b8a3ff;
    --paw-rim-a: #f8f5ff; --paw-rim-b: #e4d9ff; --paw-rim-c: #c3aaff;
    --paw-rim-d: #ab8dff; --paw-rim-e: #d6c4ff;
    --paw-glow: rgba(171, 141, 255, .38); --paw-halo: #8a6fd9; --paw-eye: #f7f3ff;
  }
  * { box-sizing: border-box; }
  html { color-scheme: dark; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.6 var(--body); -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }

  /* --- header: wordmark, filters, the one CTA, one line -------------------- */
  header {
    position: sticky; top: 0; z-index: 5; height: 72px;
    display: grid; grid-template-columns: auto 1fr auto auto; align-items: center; gap: 1.5rem;
    padding: 0 clamp(1rem, 3vw, 2.5rem);
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(10px); border-bottom: 1px solid var(--line);
  }
  .mark { display: flex; align-items: center; gap: .6rem; font: 600 17px/1 var(--display); letter-spacing: -.02em; text-decoration: none; }
  .mark .paw { --fx-paw-size: 28px; --fx-paw-ground: none; }
  .pills { display: flex; gap: .4rem; justify-content: center; }
  .pill {
    font: 500 13px/1 var(--body); color: var(--dim); background: transparent;
    border: 1px solid var(--line); border-radius: 999px; padding: .55rem .95rem; cursor: pointer;
    transition: color .18s, border-color .18s, background .18s;
  }
  .pill:hover { color: var(--ink); border-color: var(--line-hi); }
  .pill[aria-pressed="true"] { color: var(--bg); background: var(--ink); border-color: var(--ink); }
  .themes { display: flex; gap: .5rem; align-items: center; }
  .swatch {
    width: 20px; height: 20px; border-radius: 50%; cursor: pointer; padding: 0;
    background: var(--sw-accent); border: 1px solid var(--line-hi);
    box-shadow: inset 0 0 0 5px var(--sw-ground);
    transition: transform .15s, box-shadow .15s;
  }
  .swatch:hover { transform: scale(1.15); }
  .swatch[aria-pressed="true"] { box-shadow: inset 0 0 0 5px var(--sw-ground), 0 0 0 2px var(--ink); }
  .cta {
    font: 600 13.5px/1 var(--display); color: var(--bg); background: var(--accent);
    border: 0; border-radius: 999px; padding: .7rem 1.05rem; text-decoration: none; white-space: nowrap;
    transition: transform .15s, filter .15s;
  }
  .cta:hover { filter: brightness(1.06); }
  .cta:active { transform: scale(.98); }

  /* --- the grid: twenty-eight live states ---------------------------------- */
  main { max-width: 1240px; margin: 0 auto; padding: clamp(2rem, 4vw, 3.5rem) clamp(1rem, 3vw, 2.5rem) 5rem; }
  .grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
          column-gap: clamp(1.5rem, 4vw, 3.5rem); row-gap: clamp(2rem, 4vw, 3.25rem);
          /* No purple on this page, the mascot included. The character's rim
             is a var() ramp, so it is re-tokened here (ice by default, the
             theme's ramp when one is set) and the app keeps its own. */
          --fx-paw-rim-a: var(--paw-rim-a, #ffffff); --fx-paw-rim-b: var(--paw-rim-b, #e6f1ff);
          --fx-paw-rim-c: var(--paw-rim-c, #a9d1ff); --fx-paw-rim-d: var(--paw-rim-d, #8cc6ff);
          --fx-paw-rim-e: var(--paw-rim-e, #cfe5ff);
          --fx-paw-glow: var(--paw-glow, rgba(140, 198, 255, .45));
          --fx-paw-halo: var(--paw-halo, #6aa9e6);
          --fx-paw-eye: var(--paw-eye, #f7fbff);
          --fx-paw-ground: none; }
  @media (max-width: 1000px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (max-width: 680px)  { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 1.25rem; row-gap: 2rem; } }
  /* No boxes. The mascots sit on the bare ground and the spacing does the
     work a border was doing: each cell is the creature plus its name, and the
     gap between cells is wide enough that nothing needs an edge. */
  /* gap stays near zero: the engine's own square box already leaves air under
     the drawing, and that air IS the spacing between creature and name. */
  .card { display: flex; flex-direction: column; align-items: center; gap: .1rem; }
  .card[hidden] { display: none; }
  .well { display: grid; place-items: center; width: 100%; aspect-ratio: 1 / 1; }
  /* The host gets a real width. --fx-paw-size is a percentage of the host,
     and a grid item with no width of its own gives a percentage nothing to
     resolve against: 28 tiles, 28 mascots, all at 0px. */
  .well .host { width: 78%; --fx-paw-size: 100%; cursor: pointer; }
  .label { font: 500 13px/1 var(--mono); color: var(--dim); letter-spacing: .02em;
           transition: color .2s; }
  .card:hover .label { color: var(--ink); }

  /* --- footer band: how to get it ----------------------------------------- */
  footer {
    border-top: 1px solid var(--line); background: var(--panel);
    padding: clamp(1.5rem, 3vw, 2.5rem) clamp(1rem, 3vw, 2.5rem);
  }
  .band { max-width: 1240px; margin: 0 auto; display: grid; grid-template-columns: 1.4fr .6fr; gap: 2rem; align-items: start; }
  @media (max-width: 760px) { .band { grid-template-columns: 1fr; } }
  .cmds { display: grid; gap: .5rem; }
  .cmd {
    display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: .75rem;
    background: var(--well); border: 1px solid var(--line); border-radius: 10px; padding: .6rem .75rem;
    font: 13px/1.4 var(--mono);
  }
  .cmd .for { color: var(--dim); font-family: var(--body); font-size: 12.5px; min-width: 6.5rem; }
  .cmd code { color: var(--ink); overflow-x: auto; white-space: nowrap; }
  .copy {
    font: 500 12px/1 var(--body); color: var(--dim); background: transparent;
    border: 1px solid var(--line); border-radius: 8px; padding: .4rem .6rem; cursor: pointer;
    transition: color .15s, border-color .15s;
  }
  .copy:hover { color: var(--ink); border-color: var(--line-hi); }
  .side { display: grid; gap: .75rem; justify-items: start; }
  .side a { color: var(--dim); text-decoration: none; font-size: 13.5px; }
  .side a:hover { color: var(--ink); }
  /* `.side a` out-specifies `.cta` on colour, which painted the second download
     button dim-on-accent. Say it explicitly. */
  .side a.cta { color: var(--bg); padding: .8rem 1.2rem; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<header>
  <a class="mark" href="/"><span class="paw" data-state="idle" aria-hidden="true"></span>Paw</a>
  <nav class="pills" id="pills" aria-label="Filter states"></nav>
  <div class="themes" id="themes" aria-label="Theme"></div>
  <a class="cta" href="https://github.com/qbtrix/paw-mascot/releases/latest">Download for macOS</a>
</header>

<main>
  <div class="grid" id="grid"></div>
</main>

<footer>
  <div class="band">
    <div class="cmds" id="cmds">
      <div class="cmd"><span class="for">Claude Code</span><code>/plugin marketplace add qbtrix/paw-mascot</code><button class="copy">Copy</button></div>
      <div class="cmd"><span class="for"></span><code>/plugin install paw-mascot@paw-mascot</code><button class="copy">Copy</button></div>
      <div class="cmd"><span class="for">Codex</span><code>codex plugin marketplace add qbtrix/paw-mascot</code><button class="copy">Copy</button></div>
      <div class="cmd"><span class="for">Any agent</span><code>npx skills add qbtrix/paw-mascot</code><button class="copy">Copy</button></div>
    </div>
    <div class="side">
      <a class="cta" href="https://github.com/qbtrix/paw-mascot/releases/latest">Download for macOS</a>
      <a href="https://github.com/qbtrix/paw-mascot">GitHub</a>
      <a href="https://github.com/qbtrix/paw-mascot/blob/main/LICENSE">MIT</a>
    </div>
  </div>
</footer>

<script type="module">
import { mount, STATE_IDS } from "/_fx/effects/paw-avatar/index.js";

// The first sixteen are the original set; the last twelve are the anime
// shorthand. The split is the effect's own ordering, restated here so the
// filter does not depend on how a future state is appended.
const ANIME = new Set(["awkward","annoyed","gloomy","dizzy","starstruck","crying",
                       "overheated","firedUp","powering","shocked","smug","deadpan"]);
const groups = { all: () => true, classic: (id) => !ANIME.has(id), anime: (id) => ANIME.has(id) };

const grid = document.getElementById("grid");
const cards = new Map();
for (const id of STATE_IDS) {
  const card = document.createElement("article");
  card.className = "card";
  card.innerHTML = `<div class="well"><div class="host"></div></div><div class="label">${id}</div>`;
  grid.append(card);
  // 24 draws a second is plenty for a tile this size, and the engine already
  // skips tiles that are off screen, so a long page costs what is visible.
  mount(card.querySelector(".host"), { state: id, fps: 24 });
  cards.set(id, card);
}
mount(document.querySelector(".mark .paw"), { state: "idle", fps: 12, track: false });

const pills = document.getElementById("pills");
for (const g of Object.keys(groups)) {
  const b = document.createElement("button");
  b.className = "pill"; b.textContent = g; b.dataset.g = g;
  b.setAttribute("aria-pressed", String(g === "all"));
  b.onclick = () => {
    for (const p of pills.children) p.setAttribute("aria-pressed", String(p === b));
    for (const [id, card] of cards) card.hidden = !groups[g](id);
  };
  pills.append(b);
}

// --- themes ------------------------------------------------------------------
// Each dot is ground + accent; clicking sets one attribute and every token,
// the mascots' material included, follows. The choice survives a reload, and
// a bad read of localStorage is just the default theme.
const THEMES = [
  ["charcoal", "#252621", "#8cc6ff"],
  ["ink",      "#141a27", "#8cc6ff"],
  ["graphite", "#202124", "#e8eaf0"],
  ["ember",    "#241f1a", "#ffb454"],
  ["moss",     "#1c211b", "#9fe8b0"],
  ["rose",     "#231d1f", "#ff9db8"],
  ["violet",   "#1e1a27", "#b8a3ff"],
];
const themeBar = document.getElementById("themes");
function setTheme(name) {
  if (name === "charcoal") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.dataset.theme = name;
  for (const b of themeBar.children) b.setAttribute("aria-pressed", String(b.dataset.t === name));
  try { localStorage.setItem("paw-theme", name); } catch {}
}
for (const [name, ground, accent] of THEMES) {
  const b = document.createElement("button");
  b.className = "swatch"; b.dataset.t = name; b.title = name;
  b.style.setProperty("--sw-ground", ground); b.style.setProperty("--sw-accent", accent);
  b.onclick = () => setTheme(name);
  themeBar.append(b);
}
let saved = "charcoal";
try { saved = localStorage.getItem("paw-theme") || "charcoal"; } catch {}
setTheme(THEMES.some(([n]) => n === saved) ? saved : "charcoal");

for (const btn of document.querySelectorAll(".copy")) {
  btn.onclick = async () => {
    const code = btn.parentElement.querySelector("code").textContent;
    try { await navigator.clipboard.writeText(code); btn.textContent = "Copied"; }
    catch { btn.textContent = "Select it"; }
    setTimeout(() => (btn.textContent = "Copy"), 1400);
  };
}
</script>
</body>
</html>
