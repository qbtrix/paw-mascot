<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>paw</title>
<!--
  The pet. One transparent window, one mascot, nothing else.

  The same page runs in two places and cannot tell which: in a browser tab
  during development, fed by dev-server.mjs over SSE, and inside the Tauri
  webview, fed by the Rust side tailing the same file. events.js picks the
  source; everything below it is identical. That is what lets the mapping be
  tuned against real sessions in a tab before there is a window to put it in.
-->
<link rel="stylesheet" href="/_fx/effects/paw-avatar/style.css">
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center;
         gap: 2px; -webkit-user-select: none; user-select: none; }
  /* The whole window is a drag handle, so the pet can be moved by grabbing it.
   *
   * No floor glow: the window is transparent, so there is no floor. It would
   * be a glow on whatever wallpaper happens to be behind, and it is also the
   * most expensive thing the avatar draws -- its blur re-rasterises with the
   * paths every frame. Wrong and costly is an easy call. */
  /* The avatar is 10px in from each side and 16px above the label, so the
   * box is 160px in the 180x204 window. That is not padding for its own
   * sake: it is glow room, and the number was measured, not guessed.
   *
   * The glow is a CSS drop-shadow, so it paints OUTSIDE the avatar's own box,
   * and the window edge is a hard clip. The drawing reaches to within 25
   * viewBox units of its box on the sides and 24 above (svg.getBBox() in
   * `creative`, the widest state), which at 176px was 13px of room -- and at
   * the 14px peak blur below the glow was still at ~5-9% alpha where the
   * window cut it, a visible edge. At 160px the head has ~22px of room on
   * every side, three sigma, and the glow is under 1% alpha by the time it
   * meets the window. So it fades instead of stopping.
   *
   * The effect's own blur peaks at 30px (`creative` pulses to 1.10, and the
   * effect reads that as 8px + 20px * pulse), which no 180px window can hold
   * at any avatar size worth having -- so the blur is scaled down too.
   *
   * The window could have been grown to fit it, and briefly was: 256x284.
   * That doubled the area of a transparent window, and macOS recomposites one
   * of those in full every display frame, so idle cost went 5.3% -> 8.3% of a
   * core. A pet that runs all day does not get to spend 3% of a core on a
   * wider halo, and the bigger rectangle also swallowed more desktop clicks.
   *
   * So the glow is scaled to fit the window instead: same curve, same
   * breathing, same ordering between states, about 46% of the size. Peaks at
   * 13.9px, which fits with room to fade.
   *
   * This restates the effect's own rule rather than tuning a variable,
   * because the blur is hardcoded in paw-fx's stylesheet and only the colour
   * is exposed. If paw-fx ever takes a --fx-paw-glow-size, use that instead
   * and delete this. */
  #pet { --fx-paw-size: min(calc(100vw - 20px), calc(100vh - 44px)); cursor: grab; --fx-paw-ground: none; }
  #pet .fx-paw-svg {
    filter: drop-shadow(0 0 calc(4px + 9px * var(--fx-paw-pulse, 0.5))
                        var(--fx-paw-glow, rgba(140, 170, 255, 0.5)));
  }
  #pet:active { cursor: grabbing; }
  /* The state, in a word, under the mascot. One word and not the reason:
   * "working" is for the person glancing over; "using Edit" is for the
   * person tuning the mapping, and that one stays in the dev readout. */
  #stage { font: 500 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .04em;
           color: rgba(214, 222, 255, .78); background: rgba(8, 10, 20, .55);
           border: 1px solid rgba(140, 160, 255, .22); border-radius: 999px;
           padding: 4px 9px; pointer-events: none; transition: opacity .25s; }
  #stage:empty { opacity: 0; }
  /* The reason, for developing; hidden in the app. */
  #why { position: fixed; left: 8px; bottom: 6px; font: 11px ui-monospace, monospace;
         color: rgba(200, 210, 240, .55); pointer-events: none; }
  body.app #why { display: none; }
</style>
</head>
<body>
<div id="pet" data-tauri-drag-region></div>
<div id="stage"></div>
<div id="why"></div>

<script type="module">
import { mount } from "/_fx/effects/paw-avatar/index.js";
import { subscribe, isApp } from "./events.js";

// The mapping is the file that changes every few minutes while it is being
// tuned, and a browser caches an imported module by its own URL -- a
// cache-buster on the page never reaches it, so an edited mapping keeps
// running as yesterday's. In the app the files come from the bundle and
// cannot go stale, so the bust is dev-only.
const { derive, trim, parseLine } = await import(isApp ? "./mapping.js" : `./mapping.js?t=${Date.now()}`);

if (isApp) document.body.classList.add("app");

const petEl = document.getElementById("pet");
// 30 draws a second, and 8 once it is asleep. The pose is a function of
// time, so a capped avatar is not a slower one: it shows the right frame
// for the moment it is drawn, just less often. Measured on the Tauri
// window, drawing the resting Paw at 60 was about 9% of a core -- most of
// it breathing and drift that nobody can see at half the rate.
const pet = mount(petEl, { state: "idle", fps: 30 });

// Grab the mascot to move the window. data-tauri-drag-region would do this
// for free, but only when the mousedown lands on the element that carries
// it, and mount() fills #pet with a div and an SVG that every click lands
// on instead. Asking for the drag ourselves works whatever the target. The
// avatar's own pointerdown still fires first, so a click is also a poke.
if (isApp) {
  const win = window.__TAURI__.window.getCurrentWindow();
  petEl.addEventListener("mousedown", (e) => {
    if (e.button === 0) win.startDragging();
  });
}
const why = document.getElementById("why");
const stage = document.getElementById("stage");

let events = [];
let lastState = null;
let lastReact = 0;

/** Re-derive from what we know. Called on every event and on a slow tick. */
function apply() {
  const now = Date.now() / 1000;
  events = trim(events, now);
  const d = derive(events, now);

  // The state changes only when the answer does; the mood nudges every tick.
  if (d.state !== lastState) {
    pet.update({ state: d.state });
    lastState = d.state;
  }
  // Reactions are one-shots keyed on the event that caused them, so a slow
  // tick landing inside the same half-second does not fire it twice.
  const tail = events[events.length - 1];
  if (d.react && tail && tail.ts !== lastReact) {
    pet.engine.react(d.react, pet.clock());
    lastReact = tail.ts;
  }
  why.textContent = `${d.state} — ${d.why}`;
  stage.textContent = d.state;
  const asleep = d.state === "sleeping";
  pace(asleep ? 2000 : 500);
  pet.update({ fps: asleep ? 8 : 30 });
}

subscribe((line) => {
  const e = parseLine(line);
  if (!e) return;
  events.push(e);
  apply();
});

// Holds expire without an event to tell us, so re-derive on a slow clock.
// 500ms is fine while something is happening. Once the mascot has been
// asleep for a while nothing can expire at all, so the tick backs off with
// it -- a pet nobody is using should cost as close to nothing as a pet can.
let tick = null;
function pace(ms) {
  if (tick && tick.ms === ms) return;
  if (tick) clearInterval(tick.id);
  tick = { ms, id: setInterval(apply, ms) };
}
pace(500);
apply();
</script>
</body>
</html>
