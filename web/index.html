<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>paw</title>
<!--
  The pet. One transparent window, one mascot, nothing else.

  The same page runs in two places and cannot tell which: in a browser tab
  during development, fed by dev-server.mjs over SSE, and inside the Tauri
  webview, fed by the Rust side tailing the same file. events.js picks the
  source; everything below it is identical. That is what lets the mapping be
  tuned against real sessions in a tab before there is a window to put it in.
-->
<link rel="stylesheet" href="/_fx/effects/paw-avatar/style.css">
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center;
         gap: 2px; -webkit-user-select: none; user-select: none; }
  /* The whole window is a drag handle, so the pet can be moved by grabbing it. */
  #pet { --fx-paw-size: min(100vw, calc(100vh - 28px)); cursor: grab; }
  #pet:active { cursor: grabbing; }
  /* The state, in a word, under the mascot. One word and not the reason:
   * "working" is for the person glancing over; "using Edit" is for the
   * person tuning the mapping, and that one stays in the dev readout. */
  #stage { font: 500 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .04em;
           color: rgba(214, 222, 255, .78); background: rgba(8, 10, 20, .55);
           border: 1px solid rgba(140, 160, 255, .22); border-radius: 999px;
           padding: 4px 9px; pointer-events: none; transition: opacity .25s; }
  #stage:empty { opacity: 0; }
  /* The reason, for developing; hidden in the app. */
  #why { position: fixed; left: 8px; bottom: 6px; font: 11px ui-monospace, monospace;
         color: rgba(200, 210, 240, .55); pointer-events: none; }
  body.app #why { display: none; }
</style>
</head>
<body>
<div id="pet" data-tauri-drag-region></div>
<div id="stage"></div>
<div id="why"></div>

<script type="module">
import { mount } from "/_fx/effects/paw-avatar/index.js";
import { derive, trim, parseLine } from "./mapping.js";
import { subscribe, isApp } from "./events.js";

if (isApp) document.body.classList.add("app");

const petEl = document.getElementById("pet");
const pet = mount(petEl, { state: "idle" });

// Grab the mascot to move the window. data-tauri-drag-region would do this
// for free, but only when the mousedown lands on the element that carries
// it, and mount() fills #pet with a div and an SVG that every click lands
// on instead. Asking for the drag ourselves works whatever the target. The
// avatar's own pointerdown still fires first, so a click is also a poke.
if (isApp) {
  const win = window.__TAURI__.window.getCurrentWindow();
  petEl.addEventListener("mousedown", (e) => {
    if (e.button === 0) win.startDragging();
  });
}
const why = document.getElementById("why");
const stage = document.getElementById("stage");

let events = [];
let lastState = null;
let lastReact = 0;

/** Re-derive from what we know. Called on every event and on a slow tick. */
function apply() {
  const now = Date.now() / 1000;
  events = trim(events, now);
  const d = derive(events, now);

  // The state changes only when the answer does; the mood nudges every tick.
  if (d.state !== lastState) {
    pet.update({ state: d.state });
    lastState = d.state;
  }
  // Reactions are one-shots keyed on the event that caused them, so a slow
  // tick landing inside the same half-second does not fire it twice.
  const tail = events[events.length - 1];
  if (d.react && tail && tail.ts !== lastReact) {
    pet.engine.react(d.react, pet.clock());
    lastReact = tail.ts;
  }
  why.textContent = `${d.state} — ${d.why}`;
  stage.textContent = d.state;
}

subscribe((line) => {
  const e = parseLine(line);
  if (!e) return;
  events.push(e);
  apply();
});

// Holds expire without an event to tell us, so re-derive on a slow clock.
setInterval(apply, 500);
apply();
</script>
</body>
</html>
